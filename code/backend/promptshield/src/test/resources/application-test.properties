# ── Isolated In-Memory H2 Database for Tests ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:promptshield_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Hibernate / JPA Configuration for H2 ─────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Override the Neon production SSL connection requirement
spring.jpa.properties.hibernate.connection.sslmode=disable

# ── JWT Configuration for Test Profile (Base64 HS256 >= 32 bytes) ────────────
jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItcHJvbXB0c2hpZWxkLXVuaXQtdGVzdHMtMTIzNDU2Nzg=
jwt.expiration=86400000

# ── AI Service Mock/Stub Settings ────────────────────────────────────
ai.service.base-url=http://localhost:8000
ai.service.timeout-seconds=5
ai.service.connect-timeout-seconds=2
ai.service.api-key=test-ai-key

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173
