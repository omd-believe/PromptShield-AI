spring.application.name=backend

# Render sets the PORT env var; fall back to 8080 for local dev and Docker.
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# Every value must be supplied via environment variable in production.
# The local defaults below are for LOCAL DEVELOPMENT ONLY.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/promptshield_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# SPRING_DATASOURCE_PASSWORD must be set via environment variable; no insecure default.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── Connection pool — tuned for Neon serverless PostgreSQL ────────────────────
# Neon closes idle connections after ~300s; keep the pool small for free-tier.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:120000}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Required for Neon SSL connections
spring.jpa.properties.hibernate.connection.sslmode=require

# ── JWT ───────────────────────────────────────────────────────────────────────
# HS256 needs >= 32 bytes. JWT_SECRET MUST be set via environment variable.
# Generate: openssl rand -base64 48
# No insecure fallback is provided; the application will fail to start if unset.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── AI microservice ───────────────────────────────────────────────────────────
# AI_SERVICE_URL: set to Cloudflare Tunnel or Tailscale Funnel URL in production
# AI_SERVICE_API_KEY: shared secret between Spring Boot and FastAPI; generated with:
#   openssl rand -hex 32
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:45}
ai.service.connect-timeout-seconds=${AI_SERVICE_CONNECT_TIMEOUT_SECONDS:10}
ai.service.api-key=${AI_SERVICE_API_KEY:}
# TLS handshake timeout — tuned for Tailscale Funnel / cloud proxy handshakes
ai.service.ssl-handshake-timeout-seconds=${AI_SERVICE_SSL_HANDSHAKE_TIMEOUT_SECONDS:15}

# ── Retry (Reactor retryWhen) ─────────────────────────────────────────────────
# Maximum number of retry attempts after the initial failure (0 = no retries, 1 = one retry)
ai.service.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:1}
# Initial backoff delay between retries (milliseconds)
ai.service.retry.initial-backoff-ms=${AI_RETRY_INITIAL_BACKOFF_MS:1000}
# Maximum backoff delay cap (milliseconds)
ai.service.retry.max-backoff-ms=${AI_RETRY_MAX_BACKOFF_MS:3000}
# Jitter factor 0.0–1.0 applied to each backoff delay
ai.service.retry.jitter-factor=${AI_RETRY_JITTER_FACTOR:0.5}

# ── Circuit Breaker (Resilience4j programmatic API) ───────────────────────────
# Minimum number of calls before the failure rate is evaluated
ai.service.circuit-breaker.minimum-calls=${AI_CB_MIN_CALLS:5}
# Percentage of failures that opens the circuit (0–100)
ai.service.circuit-breaker.failure-rate-threshold=${AI_CB_FAILURE_RATE:50}
# Duration the circuit stays OPEN before moving to HALF-OPEN (seconds)
ai.service.circuit-breaker.wait-duration-seconds=${AI_CB_WAIT_SECONDS:30}
# Calls allowed in HALF-OPEN state before deciding to close or re-open
ai.service.circuit-breaker.half-open-calls=${AI_CB_HALF_OPEN_CALLS:2}
# Sliding window size for failure-rate calculation
ai.service.circuit-breaker.sliding-window-size=${AI_CB_SLIDING_WINDOW:10}

# ── CORS (comma-separated list of allowed browser origins) ────────────────────
# In production, set to your deployed frontend URL, e.g.:
#   CORS_ALLOWED_ORIGINS=https://promptshield.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
