spring.application.name=backend
server.port=8080

# ─── Database ───────────────────────────────────────────────────────────────
# When running via Docker (docker compose up), the env vars below are injected
# by docker-compose.yaml and connect to the Postgres container.
#
# When running locally (./mvnw spring-boot:run), no env vars are set so the
# fallback values use H2 in-memory DB — no Postgres install required.
# ────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:promptshielddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 console (only active in local/H2 mode, harmless in prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA ────────────────────────────────────────────────────────────────────
# "update" works for Postgres in Docker; "create-drop" is fine for H2 locally
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Dialect is auto-detected in Spring Boot 3+ — no need to set it manually

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:r3eY3QmdZOLkeMW26ufsFXrujzAqGXpbi5IHllfOjaW}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Springdoc / Swagger ─────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.promptshield=INFO
logging.level.org.springframework.security=WARN